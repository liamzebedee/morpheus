[package]
name = "morpheus"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = { version = "0.33.3", default-features = false, features = ["default_fonts", "glow", "wgpu"] }
glam = "0.32.1"
image = { version = "0.25.10", default-features = false, features = ["png"] }
tiny-skia = "0.11"
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"
wgpu = { version = "27", features = ["metal"] }
